[package]
name = "cleanserve-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cleanserve"
path = "src/main.rs"

[package.metadata]
# build.rs sets CLEANSERVE_GIT_HASH for --version

[dependencies]
cleanserve-shared = { path = "../cleanserve-shared" }
cleanserve-core = { path = "../cleanserve-core" }
cleanserve-proxy = { path = "../cleanserve-proxy" }
cleanserve-watcher = { path = "../cleanserve-watcher" }
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs = "5"
reqwest.workspace = true
serde_json.workspace = true
ratatui = "0.29"
semver = "1.0"
serde = { workspace = true }
sha2 = "0.10"
tempfile = "3"
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
